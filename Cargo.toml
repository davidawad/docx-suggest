[package]
name = "docx-suggest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Turn any two drafts (docx, md, org) into a Word suggestions copy: tracked changes plus comments with clickable links."
homepage = "https://github.com/davidawad/docx-suggest"
repository = "https://github.com/davidawad/docx-suggest"
readme = "README.md"
keywords = ["docx", "redline", "tracked-changes", "diff", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "docx-suggest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# docdiff is not on crates.io: pinned by git URL and commit.
docdiff = { git = "https://github.com/davidawad/docdiff", rev = "f0590799483af9838afdc0d61ae25ad108c2c53a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
